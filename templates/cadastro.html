<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - FakePinterest</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="card">
      <h1>Cadastro</h1>
      <form method="POST" action="/cadastro">
        <input
          type="text"
          name="username"
          placeholder="Usuário"
          class="form-control mb-3"
          required
        />
        <input
          type="password"
          name="password"
          placeholder="Senha"
          class="form-control mb-3"
          required
        />
        <button type="submit" class="btn btn-light btn-lg">Cadastrar</button>
      </form>
      <p class="mt-3">
        Já tem conta? <a href="/login" class="text-light">Login</a>
      </p>
    </div>
  </body>
</html>
