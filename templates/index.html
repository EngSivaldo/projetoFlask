<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bloco de título correto -->
    <title>{% block titulo %}FakePinterest{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    {% block body %}
    <div class="card">
      <h1>🚀 FakePinterest</h1>
      <p>Bem-vindo ao seu primeiro site Flask!</p>
      <a href="/login" class="btn btn-light btn-lg mb-2">Login</a>
      <a href="/cadastro" class="btn btn-outline-light btn-lg">Cadastrar</a>
    </div>
    {% endblock %}
  </body>
</html>
